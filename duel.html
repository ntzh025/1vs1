<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>Дуэль 1×1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07090d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color:#e6edf3;touch-action:none;}
canvas{display:block;position:fixed;inset:0;touch-action:none;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:18px;overflow-y:auto;
  background:radial-gradient(circle at 50% 25%,#16202e 0%,#07090d 72%);z-index:10;}
.hidden{display:none!important;}

h1{margin:0;font-size:clamp(24px,7vw,46px);letter-spacing:3px;font-weight:900;
  background:linear-gradient(92deg,#4dabf7,#a78bfa,#ff6b6b);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
h2{margin:0;font-size:clamp(16px,4.5vw,26px);letter-spacing:1px;text-align:center;}
.sub{font-size:12px;opacity:.55;letter-spacing:1px;text-align:center;margin:0;}

.cols{display:flex;gap:14px;width:100%;max-width:820px;justify-content:center;flex-wrap:wrap;}
@media (max-aspect-ratio:1/1){ .cols{flex-direction:column;align-items:center;} }

.col{flex:1 1 300px;min-width:0;max-width:400px;display:flex;flex-direction:column;gap:8px;}
.col-title{font-weight:800;font-size:15px;letter-spacing:2px;text-align:center;}

.classes{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.cls-btn{flex:1 1 74px;min-width:74px;max-width:120px;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:9px 4px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09);
  color:#c9d4e3;transition:.15s;font-family:inherit;}
.cls-btn .ci{font-size:20px;line-height:1;}
.cls-btn .cn{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-align:center;}
.cls-btn .cd{font-size:8.5px;opacity:.5;text-align:center;line-height:1.1;}
.cls-btn.sel{background:rgba(77,171,247,.18);border-color:#4dabf7;
  box-shadow:0 0 18px rgba(77,171,247,.35);color:#fff;transform:translateY(-2px);}

.btn{padding:14px 34px;border-radius:16px;border:none;cursor:pointer;font-family:inherit;
  font-weight:900;font-size:16px;letter-spacing:2px;color:#04121f;
  background:linear-gradient(180deg,#6cc4ff,#2f8fe0);
  box-shadow:0 8px 22px rgba(47,143,224,.4);transition:.15s;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;box-shadow:none;}
.btn.ghost{background:transparent;color:#8fa4bd;border:2px solid rgba(143,164,189,.3);
  box-shadow:none;font-size:13px;padding:11px 26px;}

.case-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:700px;}
.case-card{flex:1 1 240px;max-width:330px;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:16px;border-radius:20px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:2px solid rgba(255,196,0,.25);transition:.2s;}
.case-card.done{border-color:#3ddc84;background:linear-gradient(180deg,rgba(61,220,132,.12),rgba(255,255,255,.02));}
.case-card .case-top{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.7;}
.case-box{font-size:56px;line-height:1;transition:transform .12s;}
.case-res{font-size:15px;font-weight:900;letter-spacing:.5px;min-height:20px;color:#ffc400;text-align:center;}

#end .big{font-size:clamp(26px,8vw,52px);font-weight:900;letter-spacing:2px;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- МЕНЮ -->
<div id="menu" class="screen">
  <h1>ДУЭЛЬ 1×1</h1>
  <p class="sub">ЛОКАЛЬНАЯ ИГРА НА ОДНОМ ЭКРАНЕ</p>
  <div class="cols">
    <div class="col">
      <div class="col-title" style="color:#4dabf7">ИГРОК 1</div>
      <div class="classes" data-p="0"></div>
    </div>
    <div class="col">
      <div class="col-title" style="color:#ff6b6b">ИГРОК 2</div>
      <div class="classes" data-p="1"></div>
    </div>
  </div>
  <button id="startBtn" class="btn">КЕЙСЫ →</button>
</div>

<!-- КЕЙСЫ -->
<div id="cases" class="screen hidden">
  <h2>📦 ОТКРОЙТЕ КЕЙСЫ</h2>
  <p class="sub">Каждому достанется случайное оружие</p>
  <div class="case-row">
    <div class="case-card" data-p="0">
      <div class="case-top" style="color:#4dabf7">ИГРОК 1</div>
      <div class="case-box">📦</div>
      <div class="case-res">НАЖМИ</div>
    </div>
    <div class="case-card" data-p="1">
      <div class="case-top" style="color:#ff6b6b">ИГРОК 2</div>
      <div class="case-box">📦</div>
      <div class="case-res">НАЖМИ</div>
    </div>
  </div>
  <button id="fightBtn" class="btn" disabled>В БОЙ</button>
</div>

<!-- КОНЕЦ -->
<div id="end" class="screen hidden">
  <div class="big" id="endTitle">—</div>
  <p class="sub" id="endSub"></p>
  <button id="rematchBtn" class="btn">РЕВАНШ</button>
  <button id="menuBtn" class="btn ghost">В МЕНЮ</button>
</div>

<script>
"use strict";
/* ============================================================
   УТИЛИТЫ
============================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

function rr(c,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ============================================================
   ЗВУК (WebAudio, без файлов)
============================================================ */
let actx=null;
function initAudio(){
  if(!actx){
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(actx && actx.state==='suspended') actx.resume();
}
function sfx(type){
  if(!actx) return;
  const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  if(type==='shot'){
    o.type='square';
    o.frequency.setValueAtTime(240,t);
    o.frequency.exponentialRampToValueAtTime(55,t+0.07);
    g.gain.setValueAtTime(0.05,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.start(t); o.stop(t+0.1);
  } else if(type==='hit'){
    o.type='triangle';
    o.frequency.setValueAtTime(700,t);
    o.frequency.exponentialRampToValueAtTime(200,t+0.09);
    g.gain.setValueAtTime(0.06,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.start(t); o.stop(t+0.11);
  } else if(type==='boom'){
    o.type='sawtooth';
    o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(35,t+0.35);
    g.gain.setValueAtTime(0.14,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    o.start(t); o.stop(t+0.42);
  } else if(type==='pickup'){
    o.type='sine';
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(1200,t+0.15);
    g.gain.setValueAtTime(0.08,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.start(t); o.stop(t+0.22);
  } else if(type==='win'){
    o.type='sine';
    o.frequency.setValueAtTime(440,t);
    o.frequency.setValueAtTime(660,t+0.12);
    o.frequency.setValueAtTime(880,t+0.24);
    g.gain.setValueAtTime(0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.start(t); o.stop(t+0.52);
  }
}

/* ============================================================
   ДАННЫЕ: КЛАССЫ ("РОДЫ ВОЙСК") И ОРУЖИЕ
============================================================ */
const CLASSES=[
  {id:'assault',name:'Штурмовик',icon:'⚡',hp:100,speed:238,dmg:1.00,reload:0.90,desc:'быстрый'},
  {id:'sniper', name:'Снайпер',   icon:'🎯',hp:85, speed:205,dmg:1.35,reload:1.00,desc:'+35% урона'},
  {id:'tank',   name:'Танк',      icon:'🛡️',hp:155,speed:180,dmg:0.90,reload:1.15,desc:'+55 HP'},
  {id:'medic',  name:'Медик',     icon:'✚', hp:100,speed:216,dmg:0.95,reload:1.00,regen:7,desc:'реген HP'}
];

const WEAPONS={
  pistol:  {name:'Пистолет',  dmg:22, rate:0.27, mag:12, reload:1.0, spread:0.040, speed:1000, pellets:1, color:'#ffd166', len:16},
  smg:     {name:'ПП «Оса»',  dmg:11, rate:0.085,mag:32, reload:1.4, spread:0.090, speed:1060, pellets:1, color:'#7ee787', len:19},
  shotgun: {name:'Дробовик',  dmg:11, rate:0.80, mag:6,  reload:1.7, spread:0.240, speed:900,  pellets:7, color:'#ff9f43', len:17},
  sniper:  {name:'Снайперка', dmg:65, rate:1.10, mag:5,  reload:1.9, spread:0.006, speed:1900, pellets:1, color:'#4dabf7', len:27},
  rocket:  {name:'Ракетница', dmg:0,  rate:1.35, mag:3,  reload:2.2, spread:0.020, speed:520,  pellets:1, color:'#ff6b6b', len:21, splash:95, splashDmg:52}
};
const WEAPON_KEYS=Object.keys(WEAPONS);

/* ============================================================
   КАРТА
============================================================ */
const W_WORLD=1400, H_WORLD=1000;

const obstacles=[
  {x:0,y:0,w:W_WORLD,h:30},
  {x:0,y:H_WORLD-30,w:W_WORLD,h:30},
  {x:0,y:0,w:30,h:H_WORLD},
  {x:W_WORLD-30,y:0,w:30,h:H_WORLD},

  {x:660,y:440,w:80,h:120},
  {x:560,y:470,w:100,h:60},
  {x:740,y:470,w:100,h:60},

  {x:220,y:180,w:200,h:40},
  {x:220,y:180,w:40,h:200},
  {x:980,y:780,w:200,h:40},
  {x:1140,y:620,w:40,h:200},

  {x:980,y:180,w:200,h:40},
  {x:1140,y:180,w:40,h:200},
  {x:220,y:780,w:200,h:40},
  {x:220,y:620,w:40,h:200},

  {x:400,y:460,w:40,h:120},
  {x:960,y:420,w:40,h:120}
];

const SPAWNS=[
  {x:140,y:140, a:0.58},
  {x:1260,y:860,a:0.58+Math.PI}
];

/* ============================================================
   CANVAS
============================================================ */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let VW=0,VH=0,DPR=1,VPS=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  canvas.width=Math.round(VW*DPR);
  canvas.height=Math.round(VH*DPR);
  canvas.style.width=VW+'px';
  canvas.style.height=VH+'px';
  layoutViewports();
}
function layoutViewports(){
  if(VH>=VW){
    VPS=[{x:0,y:0,w:VW,h:VH/2},{x:0,y:VH/2,w:VW,h:VH/2}];
  }else{
    VPS=[{x:0,y:0,w:VW/2,h:VH},{x:VW/2,y:0,w:VW/2,h:VH}];
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

function pointInViewport(x,y){
  for(let i=0;i<2;i++){
    const r=VPS[i];
    if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h) return i;
  }
  return -1;
}

/* ============================================================
   СОСТОЯНИЕ ИГРЫ
============================================================ */
const game={
  phase:'idle',        // idle | playing | over
  players:[],
  bullets:[],
  particles:[],
  cases:[],
  caseTimer:10,
  time:0,
  winner:null
};

let sel=[0,0];           // выбранный класс для каждого игрока
let caseOpened=[false,false];
let caseResults=['pistol','pistol'];

function makeStick(){ return {pid:null,bx:0,by:0,x:0,y:0,dx:0,dy:0,mag:0}; }

function makePlayer(i,clsIdx,weaponKey){
  const cls=CLASSES[clsIdx];
  const w=WEAPONS[weaponKey];
  const s=SPAWNS[i];
  return {
    id:i, cls, w,
    x:s.x, y:s.y, angle:s.a,
    hp:cls.hp, maxHp:cls.hp,
    ammo:w.mag, reloading:false, reloadT:0, fireCd:0,
    alive:true,
    color:i===0?'#4dabf7':'#ff6b6b',
    name:'Игрок '+(i+1),
    move:makeStick(), aim:makeStick(),
    wantFire:false, hitFlash:0, toast:null
  };
}

/* ============================================================
   УПРАВЛЕНИЕ (мультитач)
============================================================ */
canvas.addEventListener('pointerdown',e=>{
  initAudio();
  if(game.phase!=='playing') return;
  e.preventDefault();
  const idx=pointInViewport(e.clientX,e.clientY);
  if(idx<0) return;
  const p=game.players[idx];
  const vp=VPS[idx];
  const isLeft=e.clientX < vp.x+vp.w/2;
  const st=isLeft?p.move:p.aim;
  if(st.pid!==null) return;
  st.pid=e.pointerId;
  st.bx=e.clientX; st.by=e.clientY;
  st.x=e.clientX;  st.y=e.clientY;
  st.dx=0; st.dy=0; st.mag=0;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
},{passive:false});

canvas.addEventListener('pointermove',e=>{
  if(game.phase!=='playing') return;
  e.preventDefault();
  for(const p of game.players){
    for(const st of [p.move,p.aim]){
      if(st.pid===e.pointerId){
        st.x=e.clientX; st.y=e.clientY;
        const dx=st.x-st.bx, dy=st.y-st.by;
        const d=Math.hypot(dx,dy);
        const R=70;
        st.mag=Math.min(d/R,1);
        if(d>0.001){ st.dx=dx/d; st.dy=dy/d; }
        else { st.dx=0; st.dy=0; }
      }
    }
  }
},{passive:false});

function endPointer(e){
  for(const p of game.players){
    for(const st of [p.move,p.aim]){
      if(st.pid===e.pointerId){
        st.pid=null; st.mag=0; st.dx=0; st.dy=0;
      }
    }
  }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',endPointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function resetSticks(){
  for(const p of game.players){
    for(const st of [p.move,p.aim]){
      st.pid=null; st.mag=0; st.dx=0; st.dy=0;
    }
  }
}

/* ============================================================
   ФИЗИКА
============================================================ */
function resolveCircleRect(p,r,o){
  const cx=clamp(p.x,o.x,o.x+o.w);
  const cy=clamp(p.y,o.y,o.y+o.h);
  let dx=p.x-cx, dy=p.y-cy;
  let d2=dx*dx+dy*dy;
  if(d2>=r*r) return;
  if(d2>0.0001){
    const d=Math.sqrt(d2);
    p.x=cx+dx/d*r;
    p.y=cy+dy/d*r;
  }else{
    // центр внутри прямоугольника — выталкиваем по ближайшей стороне
    const left=p.x-o.x, right=o.x+o.w-p.x;
    const top=p.y-o.y,  bottom=o.y+o.h-p.y;
    const m=Math.min(left,right,top,bottom);
    if(m===left) p.x=o.x-r;
    else if(m===right) p.x=o.x+o.w+r;
    else if(m===top) p.y=o.y-r;
    else p.y=o.y+o.h+r;
  }
}

function collidePlayer(p){
  const r=18;
  for(const o of obstacles) resolveCircleRect(p,r,o);
  p.x=clamp(p.x,r,W_WORLD-r);
  p.y=clamp(p.y,r,H_WORLD-r);
}

/* ============================================================
   ЭФФЕКТЫ
============================================================ */
function burst(x,y,color,n,power){
  power=power||1;
  for(let i=0;i<n;i++){
    if(game.particles.length>420) break;
    const a=Math.random()*Math.PI*2;
    const sp=rnd(40,230)*power;
    game.particles.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:rnd(0.18,0.5),max:0.5,color,size:rnd(2,5)
    });
  }
}

function explode(x,y,owner){
  sfx('boom');
  burst(x,y,'#ff9f43',26,1.6);
  burst(x,y,'#ff6b6b',16,1.1);
  const R=95;
  for(const p of game.players){
    if(!p.alive||p.id===owner) continue;
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<R){
      const k=1-d/R;
      damage(p,52*k,owner);
    }
  }
}

/* ============================================================
   БОЙ
============================================================ */
function fire(p){
  const w=p.w;
  p.ammo--;
  p.fireCd=w.rate;
  for(let i=0;i<w.pellets;i++){
    const a=p.angle+(Math.random()-0.5)*w.spread*2;
    game.bullets.push({
      x:p.x+Math.cos(p.angle)*22,
      y:p.y+Math.sin(p.angle)*22,
      vx:Math.cos(a)*w.speed,
      vy:Math.sin(a)*w.speed,
      dmg:w.dmg*p.cls.dmg,
      owner:p.id,
      color:w.color,
      life:1.8,
      rocket:!!w.splash
    });
  }
  burst(p.x+Math.cos(p.angle)*26,p.y+Math.sin(p.angle)*26,w.color,3,0.5);
  sfx('shot');
  if(p.ammo<=0){ p.reloading=true; p.reloadT=w.reload*p.cls.reload; }
}

function damage(p,amount,fromId){
  if(!p.alive||game.phase!=='playing') return;
  p.hp-=amount;
  p.hitFlash=0.14;
  sfx('hit');
  if(p.hp<=0){
    p.hp=0; p.alive=false;
    burst(p.x,p.y,p.color,30,1.4);
    const winner=game.players.find(x=>x.id===fromId)||null;
    endRound(winner);
  }
}

function endRound(winner){
  if(game.phase!=='playing') return;
  game.phase='over';
  game.winner=winner;
  resetSticks();
  sfx('win');
  setTimeout(()=>showEnd(winner),1000);
}

/* ============================================================
   ОБНОВЛЕНИЕ
============================================================ */
function updateEffects(dt){
  for(let i=game.particles.length-1;i>=0;i--){
    const pt=game.particles[i];
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.vx*=0.93; pt.vy*=0.93;
    pt.life-=dt;
    if(pt.life<=0) game.particles.splice(i,1);
  }
}

function update(dt){
  game.time+=dt;
  const players=game.players;

  /* кейсы в бою */
  game.caseTimer-=dt;
  if(game.caseTimer<=0 && game.cases.length<2){
    game.caseTimer=rnd(11,17);
    spawnCase();
  }

  for(const p of players){
    if(!p.alive) continue;

    if(p.hitFlash>0) p.hitFlash-=dt;
    if(p.toast){ p.toast.t-=dt; if(p.toast.t<=0) p.toast=null; }

    if(p.cls.regen && p.hp<p.maxHp){
      p.hp=Math.min(p.maxHp,p.hp+p.cls.regen*dt);
    }

    /* движение */
    const m=p.move;
    if(m.mag>0.12){
      const sp=p.cls.speed*clamp(m.mag/0.7,0,1);
      p.x+=m.dx*sp*dt;
      p.y+=m.dy*sp*dt;
    }

    /* прицел */
    const a=p.aim;
    if(a.mag>0.30){
      p.angle=Math.atan2(a.dy,a.dx);
      p.wantFire=true;
    }else{
      p.wantFire=false;
    }

    /* стрельба / перезарядка */
    if(p.reloading){
      p.reloadT-=dt;
      if(p.reloadT<=0){
        p.reloading=false;
        p.ammo=p.w.mag;
      }
    }else{
      if(p.fireCd>0) p.fireCd-=dt;
      if(p.wantFire&&p.fireCd<=0){
        if(p.ammo>0) fire(p);
        else { p.reloading=true; p.reloadT=p.w.reload*p.cls.reload; }
      }
      if(p.ammo<=0&&!p.reloading){
        p.reloading=true;
        p.reloadT=p.w.reload*p.cls.reload;
      }
    }

    collidePlayer(p);
  }

  /* расталкивание игроков */
  if(players[0].alive&&players[1].alive){
    const a=players[0],b=players[1];
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.hypot(dx,dy);
    const min=36;
    if(d<min&&d>0.001){
      const push=(min-d)/2;
      dx/=d; dy/=d;
      a.x-=dx*push; a.y-=dy*push;
      b.x+=dx*push; b.y+=dy*push;
      collidePlayer(a); collidePlayer(b);
    }
  }

  /* пули */
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    const dist=Math.hypot(b.vx,b.vy)*dt;
    const steps=Math.max(1,Math.ceil(dist/13));
    let hitWall=false, hitPlayer=null;

    for(let s=0;s<steps;s++){
      b.x+=b.vx*dt/steps;
      b.y+=b.vy*dt/steps;

      if(b.x<0||b.y<0||b.x>W_WORLD||b.y>H_WORLD){ hitWall=true; break; }

      for(const o of obstacles){
        if(b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h){ hitWall=true; break; }
      }
      if(hitWall) break;

      for(const p of players){
        if(!p.alive||p.id===b.owner) continue;
        if(Math.hypot(p.x-b.x,p.y-b.y)<21){ hitPlayer=p; break; }
      }
      if(hitPlayer) break;
    }

    b.life-=dt;

    if(hitPlayer){
      if(b.rocket){
        explode(b.x,b.y,b.owner);
      }else{
        damage(hitPlayer,b.dmg,b.owner);
        burst(b.x,b.y,'#ffffff',6,0.7);
      }
      game.bullets.splice(i,1);
    }else if(hitWall){
      if(b.rocket) explode(b.x,b.y,b.owner);
      else burst(b.x,b.y,b.color,4,0.5);
      game.bullets.splice(i,1);
    }else if(b.life<=0){
      game.bullets.splice(i,1);
    }
  }

  /* подбор кейсов */
  for(let i=game.cases.length-1;i>=0;i--){
    const c=game.cases[i];
    c.t+=dt;
    for(const p of players){
      if(!p.alive) continue;
      if(Math.hypot(p.x-c.x,p.y-c.y)<36){
        const key=pick(WEAPON_KEYS);
        p.w=WEAPONS[key];
        p.ammo=p.w.mag;
        p.reloading=false; p.reloadT=0; p.fireCd=0;
        p.toast={text:'КЕЙС: '+p.w.name,t:1.8};
        burst(c.x,c.y,'#ffc400',20,1.2);
        sfx('pickup');
        game.cases.splice(i,1);
        break;
      }
    }
  }

  updateEffects(dt);
}

function spawnCase(){
  let x=0,y=0,ok=false;
  for(let tries=0;tries<60&&!ok;tries++){
    x=rnd(120,W_WORLD-120);
    y=rnd(120,H_WORLD-120);
    ok=true;
    for(const o of obstacles){
      if(x>o.x-45&&x<o.x+o.w+45&&y>o.y-45&&y<o.y+o.h+45){ ok=false; break; }
    }
    if(ok){
      for(const p of game.players){
        if(p.alive&&Math.hypot(p.x-x,p.y-y)<220){ ok=false; break; }
      }
    }
  }
  if(ok) game.cases.push({x,y,t:0});
}

/* ============================================================
   РЕНДЕР
============================================================ */
function drawViewport(i){
  const rect=VPS[i];
  const me=game.players[i];
  if(!me) return;

  const s=Math.min(rect.w,rect.h)/560;
  const halfW=rect.w/(2*s), halfH=rect.h/(2*s);
  let camX=(halfW*2>=W_WORLD)?W_WORLD/2:clamp(me.x,halfW,W_WORLD-halfW);
  let camY=(halfH*2>=H_WORLD)?H_WORLD/2:clamp(me.y,halfH,H_WORLD-halfH);

  ctx.save();
  ctx.beginPath(); ctx.rect(rect.x,rect.y,rect.w,rect.h); ctx.clip();
  ctx.fillStyle='#080a0e';
  ctx.fillRect(rect.x,rect.y,rect.w,rect.h);

  ctx.save();
  ctx.translate(rect.x+rect.w/2,rect.y+rect.h/2);
  ctx.scale(s,s);
  ctx.translate(-camX,-camY);
  drawWorld(i,s);
  ctx.restore();

  drawHUD(i,rect,s,camX,camY);
  ctx.restore();
}

function drawWorld(viewIdx,s){
  /* пол */
  ctx.fillStyle='#11151d';
  ctx.fillRect(0,0,W_WORLD,H_WORLD);

  /* сетка */
  ctx.strokeStyle='rgba(120,160,255,0.055)';
  ctx.lineWidth=1/s;
  ctx.beginPath();
  for(let x=0;x<=W_WORLD;x+=100){ ctx.moveTo(x,0); ctx.lineTo(x,H_WORLD); }
  for(let y=0;y<=H_WORLD;y+=100){ ctx.moveTo(0,y); ctx.lineTo(W_WORLD,y); }
  ctx.stroke();

  /* стены */
  for(const o of obstacles){
    rr(ctx,o.x,o.y,o.w,o.h,8);
    ctx.fillStyle='#1b2331';
    ctx.fill();
    ctx.strokeStyle='#2e3d55';
    ctx.lineWidth=2/s;
    ctx.stroke();
  }

  /* рамка мира */
  ctx.strokeStyle='rgba(120,160,255,0.28)';
  ctx.lineWidth=3/s;
  ctx.strokeRect(0,0,W_WORLD,H_WORLD);

  /* кейсы */
  for(const c of game.cases){
    const pulse=1+Math.sin(c.t*4)*0.07;
    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.scale(pulse,pulse);
    ctx.beginPath(); ctx.arc(0,0,27,0,7);
    ctx.fillStyle='rgba(255,196,0,0.14)'; ctx.fill();
    ctx.strokeStyle='#ffc400'; ctx.lineWidth=2.5/s; ctx.stroke();
    ctx.font='28px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('📦',0,2);
    ctx.restore();
  }

  /* частицы */
  for(const pt of game.particles){
    ctx.globalAlpha=clamp(pt.life/pt.max,0,1);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* пули */
  ctx.lineCap='round';
  for(const b of game.bullets){
    ctx.strokeStyle=b.color;
    ctx.lineWidth=4/s;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-b.vx*0.018,b.y-b.vy*0.018);
    ctx.stroke();
  }

  /* игроки */
  for(const p of game.players) drawPlayer(p);
}

function drawPlayer(p){
  if(!p.alive){
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,7);
    ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=2;
    ctx.stroke();
    return;
  }
  ctx.save();
  ctx.translate(p.x,p.y);

  /* тень */
  ctx.beginPath(); ctx.ellipse(0,8,20,13,0,0,7);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();

  /* тело */
  ctx.beginPath(); ctx.arc(0,0,18,0,7);
  ctx.fillStyle=p.hitFlash>0?'#ffffff':p.color;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)';
  ctx.lineWidth=2.5;
  ctx.stroke();

  /* оружие */
  ctx.save();
  ctx.rotate(p.angle);
  ctx.fillStyle='#dfe7f3';
  rr(ctx,10,-4.5,p.w.len,9,3); ctx.fill();
  ctx.restore();

  /* глаз */
  ctx.beginPath();
  ctx.arc(Math.cos(p.angle)*6,Math.sin(p.angle)*6,5,0,7);
  ctx.fillStyle='#0b0e14';
  ctx.fill();

  ctx.restore();

  /* полоска HP над головой */
  const w=56,h=7;
  ctx.fillStyle='rgba(0,0,0,0.65)';
  rr(ctx,p.x-w/2,p.y-40,w,h,3.5); ctx.fill();
  const r=clamp(p.hp/p.maxHp,0,1);
  ctx.fillStyle=r>0.5?'#3ddc84':r>0.25?'#ffc107':'#ff4d4d';
  if(r>0.01){ rr(ctx,p.x-w/2,p.y-40,Math.max(4,w*r),h,3.5); ctx.fill(); }
}

function drawHUD(i,rect,s,camX,camY){
  const me=game.players[i];
  const foe=game.players[1-i];

  /* --- HP игрока --- */
  const bw=clamp(rect.w*0.44,110,240), bh=16;
  const bx=rect.x+12, by=rect.y+12;

  ctx.fillStyle='rgba(0,0,0,0.55)';
  rr(ctx,bx,by,bw,bh,8); ctx.fill();
  const hr=clamp(me.hp/me.maxHp,0,1);
  ctx.fillStyle=hr>0.5?'#3ddc84':hr>0.25?'#ffc107':'#ff4d4d';
  if(hr>0.01){ rr(ctx,bx,by,Math.max(8,bw*hr),bh,8); ctx.fill(); }
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=1.5;
  rr(ctx,bx,by,bw,bh,8); ctx.stroke();

  ctx.fillStyle='#ffffff';
  ctx.font='bold 11px system-ui';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(me.name+' • '+me.cls.name+'  '+Math.ceil(me.hp),bx+8,by+bh/2+0.5);

  /* --- HP врага --- */
  const by2=by+bh+5;
  ctx.fillStyle='rgba(0,0,0,0.55)';
  rr(ctx,bx,by2,bw,7,4); ctx.fill();
  const er=clamp(foe.hp/foe.maxHp,0,1);
  if(er>0.01){
    ctx.fillStyle=foe.color;
    rr(ctx,bx,by2,Math.max(4,bw*er),7,4); ctx.fill();
  }

  /* --- оружие / патроны --- */
  ctx.textAlign='right';
  ctx.font='bold 13px system-ui';
  ctx.fillStyle=me.w.color;
  ctx.fillText(me.w.name,rect.x+rect.w-14,rect.y+20);

  ctx.font='bold 12px system-ui';
  if(me.reloading){
    ctx.fillStyle='#ff9f43';
    ctx.fillText('ПЕРЕЗАРЯДКА',rect.x+rect.w-14,rect.y+39);
    /* прогресс перезарядки */
    const pr=clamp(1-me.reloadT/(me.w.reload*me.cls.reload),0,1);
    ctx.fillStyle='rgba(0,0,0,0.6)';
    rr(ctx,rect.x+rect.w-14-70,rect.y+48,70,5,2.5); ctx.fill();
    ctx.fillStyle='#ff9f43';
    rr(ctx,rect.x+rect.w-14-70,rect.y+48,70*pr,5,2.5); ctx.fill();
  }else{
    ctx.fillStyle=me.ammo<=2?'#ff6b6b':'#c9d4e3';
    ctx.fillText(me.ammo+' / '+me.w.mag,rect.x+rect.w-14,rect.y+39);
  }

  /* --- указатель на врага --- */
  if(foe.alive){
    const px=rect.x+rect.w/2+(foe.x-camX)*s;
    const py=rect.y+rect.h/2+(foe.y-camY)*s;
    const pad=26;
    const inView=px>rect.x+pad&&px<rect.x+rect.w-pad&&py>rect.y+pad&&py<rect.y+rect.h-pad;
    if(!inView){
      const ccx=rect.x+rect.w/2, ccy=rect.y+rect.h/2;
      let dx=px-ccx, dy=py-ccy;
      const d=Math.hypot(dx,dy)||1;
      dx/=d; dy/=d;
      const R=Math.min(rect.w,rect.h)*0.34;
      const ax=ccx+dx*R, ay=ccy+dy*R;
      ctx.save();
      ctx.translate(ax,ay);
      ctx.rotate(Math.atan2(dy,dx));
      ctx.beginPath();
      ctx.moveTo(14,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9);
      ctx.closePath();
      ctx.fillStyle=foe.color;
      ctx.globalAlpha=0.9;
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha=1;
    }
  }

  /* --- тост (подобранный кейс) --- */
  if(me.toast){
    ctx.textAlign='center';
    ctx.font='bold 15px system-ui';
    ctx.globalAlpha=clamp(me.toast.t,0,1);
    ctx.fillStyle='#ffc400';
    ctx.fillText(me.toast.text,rect.x+rect.w/2,rect.y+rect.h-140);
    ctx.globalAlpha=1;
  }

  /* --- джойстики --- */
  const R=clamp(Math.min(rect.w,rect.h)*0.16,40,70);
  const defMove={x:rect.x+R+22,y:rect.y+rect.h-R-22};
  const defAim ={x:rect.x+rect.w-R-22,y:rect.y+rect.h-R-22};

  drawStick(me.move,defMove.x,defMove.y,R,'#7ee787',me.move.pid!==null);
  drawStick(me.aim, defAim.x, defAim.y, R,'#ff9f43',me.aim.pid!==null);

  /* --- рамка вьюпорта --- */
  ctx.strokeStyle='rgba(255,255,255,0.07)';
  ctx.lineWidth=2;
  ctx.strokeRect(rect.x+1,rect.y+1,rect.w-2,rect.h-2);
}

function drawStick(st,defX,defY,R,color,active){
  const bx=active?st.bx:defX;
  const by=active?st.by:defY;

  ctx.beginPath(); ctx.arc(bx,by,R,0,7);
  ctx.fillStyle=active?'rgba(255,255,255,0.08)':'rgba(255,255,255,0.045)';
  ctx.fill();
  ctx.strokeStyle=active?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.10)';
  ctx.lineWidth=2;
  ctx.stroke();

  let kx=bx, ky=by;
  if(active){
    const dx=st.x-st.bx, dy=st.y-st.by;
    const d=Math.hypot(dx,dy);
    const k=d>R?R/d:1;
    kx=st.bx+dx*k;
    ky=st.by+dy*k;
  }
  ctx.beginPath(); ctx.arc(kx,ky,R*0.42,0,7);
  ctx.fillStyle=active?(color+'cc'):(color+'33');
  ctx.fill();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.fillStyle='#05070a';
  ctx.fillRect(0,0,VW,VH);

  if(game.phase==='idle') return;
  drawViewport(0);
  drawViewport(1);
}

/* ============================================================
   ИГРОВОЙ ЦИКЛ
============================================================ */
let last=0;
function loop(ts){
  if(!last) last=ts;
  let dt=(ts-last)/1000;
  last=ts;
  dt=Math.min(dt,0.05);

  if(game.phase==='playing') update(dt);
  else if(game.phase==='over') updateEffects(dt);

  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   ИНТЕРФЕЙС: МЕНЮ
============================================================ */
function buildClassButtons(){
  document.querySelectorAll('.classes').forEach((el,pi)=>{
    el.innerHTML='';
    CLASSES.forEach((c,ci)=>{
      const b=document.createElement('button');
      b.className='cls-btn';
      b.innerHTML='<span class="ci">'+c.icon+'</span>'+
                  '<span class="cn">'+c.name+'</span>'+
                  '<span class="cd">'+c.desc+'</span>';
      b.addEventListener('click',()=>{
        initAudio();
        sel[pi]=ci;
        refreshSel();
      });
      el.appendChild(b);
    });
  });
  refreshSel();
}
function refreshSel(){
  document.querySelectorAll('.classes').forEach((el,pi)=>{
    [...el.children].forEach((b,ci)=>b.classList.toggle('sel',sel[pi]===ci));
  });
}

/* ============================================================
   ИНТЕРФЕЙС: КЕЙСЫ
============================================================ */
const casesScreen=document.getElementById('cases');
const fightBtn=document.getElementById('fightBtn');
const caseCards=document.querySelectorAll('.case-card');

function resetCases(){
  caseOpened=[false,false];
  caseResults=['pistol','pistol'];
  fightBtn.disabled=true;
  caseCards.forEach((card,i)=>{
    card.classList.remove('done');
    const box=card.querySelector('.case-box');
    const res=card.querySelector('.case-res');
    box.textContent='📦';
    box.style.transform='';
    res.textContent='НАЖМИ';
    res.style.color='#ffc400';
  });
}

caseCards.forEach((card,i)=>{
  card.addEventListener('click',()=>{
    initAudio();
    openCase(i);
  });
});

function openCase(i){
  if(caseOpened[i]) return;
  caseOpened[i]=true;
  const card=caseCards[i];
  const box=card.querySelector('.case-box');
  const res=card.querySelector('.case-res');

  let t=0;
  const iv=setInterval(()=>{
    const k=pick(WEAPON_KEYS);
    res.textContent=WEAPONS[k].name;
    res.style.color=WEAPONS[k].color;
    box.style.transform='scale('+(1+Math.random()*0.14)+') rotate('+(Math.random()*22-11)+'deg)';
    sfx('hit');
    t++;
  },70);

  setTimeout(()=>{
    clearInterval(iv);
    const k=pick(WEAPON_KEYS);
    caseResults[i]=k;
    res.textContent=WEAPONS[k].name;
    res.style.color=WEAPONS[k].color;
    box.textContent='🎁';
    box.style.transform='scale(1.15)';
    card.classList.add('done');
    sfx('pickup');
    if(caseOpened[0]&&caseOpened[1]) fightBtn.disabled=false;
  },1150);
}

/* ============================================================
   СТАРТ / КОНЕЦ МАТЧА
============================================================ */
const menuScreen=document.getElementById('menu');
const endScreen=document.getElementById('end');

function startMatch(){
  game.phase='playing';
  game.bullets=[];
  game.particles=[];
  game.cases=[];
  game.time=0;
  game.caseTimer=9;
  game.winner=null;

  game.players=[
    makePlayer(0,sel[0],caseResults[0]),
    makePlayer(1,sel[1],caseResults[1])
  ];

  /* стартовые кейсы на карте через пару секунд */
  layoutViewports();
}

function showEnd(winner){
  resetSticks();
  const title=document.getElementById('endTitle');
  const sub=document.getElementById('endSub');
  if(winner){
    title.textContent=winner.name+' ПОБЕДИЛ!';
    title.style.color=winner.color;
    sub.textContent='Класс: '+winner.cls.name+' • Оружие: '+winner.w.name;
  }else{
    title.textContent='НИЧЬЯ';
    title.style.color='#8fa4bd';
    sub.textContent='';
  }
  endScreen.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  resetCases();
  menuScreen.classList.add('hidden');
  casesScreen.classList.remove('hidden');
});

fightBtn.addEventListener('click',()=>{
  initAudio();
  casesScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startMatch();
});

document.getElementById('rematchBtn').addEventListener('click',()=>{
  endScreen.classList.add('hidden');
  resetCases();
  casesScreen.classList.remove('hidden');
  game.phase='idle';
  game.players=[];
});

document.getElementById('menuBtn').addEventListener('click',()=>{
  endScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  game.phase='idle';
  game.players=[];
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
============================================================ */
buildClassButtons();
resize();
requestAnimationFrame(loop);
</script>
