<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Дуэль — Mirage 1v1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;}
#hud.on{display:block;}

#crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);}
#crosshair .h,#crosshair .v{position:absolute;background:#7ee787;
  box-shadow:0 0 6px rgba(126,231,135,.95);}
#crosshair .h{left:0;top:50%;width:100%;height:2px;transform:translateY(-50%);}
#crosshair .v{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
#crosshair .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;
  background:#ff4d4d;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 6px #ff4d4d;}

#hitmarker{position:absolute;left:50%;top:50%;width:20px;height:20px;
  transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .1s;}
#hitmarker::before,#hitmarker::after{content:'';position:absolute;background:#fff;}
#hitmarker::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
#hitmarker::after{left:0;top:50%;width:100%;height:2px;transform:translateY(-50%);}
#hitmarker.on{opacity:1;}

#hud-hp{position:absolute;left:20px;bottom:20px;font-size:32px;font-weight:900;
  color:#3ddc84;text-shadow:0 2px 12px rgba(0,0,0,.9);}
#hud-hp span{font-size:13px;opacity:.65;margin-left:4px;}
#hud-ammo{position:absolute;right:20px;bottom:20px;font-size:32px;font-weight:900;
  color:#ffc107;text-shadow:0 2px 12px rgba(0,0,0,.9);}
#hud-ammo span{font-size:14px;opacity:.65;margin-left:4px;}
#hud-weapon{position:absolute;right:22px;bottom:66px;font-size:13px;color:#8fa4bd;
  letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.9);}
#hud-kills{position:absolute;left:20px;top:20px;font-size:14px;color:#c9d4e3;
  background:rgba(0,0,0,.4);padding:8px 14px;border-radius:10px;
  text-shadow:0 1px 4px #000;}
#hud-score{position:absolute;right:20px;top:20px;font-size:14px;color:#c9d4e3;
  background:rgba(0,0,0,.4);padding:8px 14px;border-radius:10px;
  text-shadow:0 1px 4px #000;}

#killfeed{position:absolute;left:50%;top:22px;transform:translateX(-50%);
  font-size:16px;font-weight:800;text-align:center;
  text-shadow:0 2px 10px rgba(0,0,0,.95);opacity:0;transition:opacity .3s;
  letter-spacing:1px;}
#killfeed.on{opacity:1;}

#deadmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(24px,7vw,44px);font-weight:900;color:#ff4d4d;display:none;
  text-align:center;letter-spacing:3px;
  text-shadow:0 4px 30px rgba(0,0,0,.95);}
#deadmsg.on{display:block;}

#damage-flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,0,0,0) 40%,rgba(255,0,0,.55) 100%);
  opacity:0;transition:opacity .1s;pointer-events:none;}

/* ============ TÜCH КОНТРОЛЫ ============ */
#touch{position:fixed;inset:0;pointer-events:none;z-index:6;display:none;}
#touch.on{display:block;}

#joy{position:absolute;left:22px;bottom:22px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;touch-action:none;}
#joy .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;
  background:rgba(126,231,135,.55);border:2px solid rgba(126,231,135,.9);
  transform:translate(-50%,-50%);pointer-events:none;
  box-shadow:0 0 18px rgba(126,231,135,.4);}

#look-zone{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;}

.tbtn{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.28);color:#fff;display:flex;
  align-items:center;justify-content:center;pointer-events:auto;
  font-weight:900;touch-action:none;backdrop-filter:blur(4px);}
.tbtn:active{background:rgba(255,255,255,.25);transform:scale(.94);}

#btn-fire{right:20px;bottom:20px;width:96px;height:96px;font-size:38px;
  background:rgba(255,77,77,.28);border-color:rgba(255,77,77,.6);}
#btn-reload{right:130px;bottom:126px;width:58px;height:58px;font-size:24px;}
#btn-weapon{right:24px;bottom:130px;width:58px;height:58px;font-size:24px;}

/* ============ МЕНЮ ============ */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;z-index:10;
  background:radial-gradient(circle at 50% 30%,#2a1f14,#0a0705 78%);overflow-y:auto;}
.screen.hidden{display:none;}
h1{font-size:clamp(32px,9vw,58px);letter-spacing:6px;font-weight:900;
  background:linear-gradient(90deg,#ffc107,#ff8b3d,#ff4d4d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;filter:drop-shadow(0 4px 20px rgba(255,139,61,.3));}
.sub{font-size:13px;color:#c9a878;max-width:440px;text-align:center;
  line-height:1.6;letter-spacing:.5px;}
.controls-hint{font-size:12px;color:#8fa4bd;max-width:440px;text-align:center;
  line-height:1.8;background:rgba(0,0,0,.4);padding:12px 18px;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);}
.controls-hint b{color:#ffc107;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;
  padding:16px 40px;font-size:18px;font-weight:900;letter-spacing:2px;
  color:#04121f;background:linear-gradient(180deg,#ffc107,#ff8b3d);
  box-shadow:0 8px 26px rgba(255,139,61,.4);transition:.15s;text-transform:uppercase;}
button:active{transform:scale(.96);}
.weapons-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
.weapon-badge{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800;
  letter-spacing:1px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);color:#c9d4e3;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="damage-flash"></div>
  <div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>
  <div id="hitmarker"></div>
  <div id="hud-hp">100<span>HP</span></div>
  <div id="hud-ammo">30<span>/ 30</span></div>
  <div id="hud-weapon">АК-47</div>
  <div id="hud-kills">Убийств: 0</div>
  <div id="hud-score">Бот: 0</div>
  <div id="killfeed"></div>
  <div id="deadmsg">ВЫ ПОГИБЛИ</div>
</div>

<!-- Мобильные контролы -->
<div id="touch">
  <div id="joy"><div class="knob"></div></div>
  <div id="look-zone"></div>
  <button id="btn-fire" class="tbtn">🔫</button>
  <button id="btn-reload" class="tbtn">⟳</button>
  <button id="btn-weapon" class="tbtn">⇄</button>
</div>

<!-- Меню -->
<div id="menu" class="screen">
  <h1>MIRAGE 1v1</h1>
  <p class="sub">Ты против бота на карте в арабском стиле. Уничтожь противника, не дай убить себя.</p>
  <div class="weapons-row">
    <div class="weapon-badge" style="border-color:#ffc107;color:#ffc107">AK-47</div>
    <div class="weapon-badge" style="border-color:#4dabf7;color:#4dabf7">AWP</div>
    <div class="weapon-badge" style="border-color:#ff6b6b;color:#ff6b6b">НОЖ</div>
  </div>
  <div class="controls-hint" id="hint"></div>
  <button id="startBtn">В БОЙ</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
document.getElementById('hint').innerHTML = isTouch
  ? '<b>Джойстик слева</b> — движение · <b>Свайп справа</b> — обзор · <b>🔫</b> — огонь · <b>⟳</b> — перезарядка · <b>⇄</b> — смена оружия'
  : '<b>WASD</b> — движение · <b>Мышь</b> — обзор · <b>ЛКМ</b> — огонь · <b>R</b> — перезарядка · <b>1/2/3</b> — оружие · <b>Space</b> — прыжок';

/* ============================================================
   УТИЛИТЫ
============================================================ */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd   = (a,b) => a + Math.random()*(b-a);

let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function sfx(type){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  if(type === 'ak'){
    o.type = 'square';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(50, t+0.07);
    g.gain.setValueAtTime(0.055, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.09);
    o.start(t); o.stop(t+0.1);
  } else if(type === 'awp'){
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(40, t+0.22);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    o.start(t); o.stop(t+0.26);
  } else if(type === 'knife'){
    o.type = 'triangle';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(300, t+0.08);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.start(t); o.stop(t+0.11);
  } else if(type === 'hit'){
    o.type = 'triangle';
    o.frequency.setValueAtTime(950, t);
    o.frequency.exponentialRampToValueAtTime(400, t+0.06);
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
    o.start(t); o.stop(t+0.09);
  } else if(type === 'reload'){
    o.type = 'sine';
    o.frequency.setValueAtTime(400, t);
    o.frequency.setValueAtTime(600, t+0.07);
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.16);
    o.start(t); o.stop(t+0.17);
  } else if(type === 'death'){
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(60, t+0.5);
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
    o.start(t); o.stop(t+0.56);
  }
}

/* ============================================================
   СЦЕНА
============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4b896);
scene.fog = new THREE.Fog(0xd4b896, 32, 78);

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

/* освещение — солнечный полдень */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb89060, 1.15));
const sun = new THREE.DirectionalLight(0xfff2c8, 2.3);
sun.position.set(18, 32, 12);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-18, 15, -18);
scene.add(fill);

/* ============================================================
   ТЕКСТУРЫ
============================================================ */
function makeSandTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#c9a878'; g.fillRect(0,0,512,512);
  for(let i = 0; i < 4000; i++){
    g.fillStyle = `rgba(${100+rnd(0,90)|0},${70+rnd(0,60)|0},${40+rnd(0,40)|0},0.25)`;
    g.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }
  g.strokeStyle = 'rgba(120,90,60,0.16)'; g.lineWidth = 2;
  for(let i = 0; i < 512; i += 64){
    g.beginPath(); g.moveTo(i,0); g.lineTo(i,512); g.stroke();
    g.beginPath(); g.moveTo(0,i); g.lineTo(512,i); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(12,12);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeStoneTex(base){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  for(let i = 0; i < 1500; i++){
    g.fillStyle = `rgba(${100+rnd(0,60)|0},${80+rnd(0,50)|0},${50+rnd(0,40)|0},0.15)`;
    g.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  g.strokeStyle = 'rgba(80,60,40,0.25)'; g.lineWidth = 2;
  for(let y = 0; y < 256; y += 32){
    g.beginPath(); g.moveTo(0,y); g.lineTo(256,y); g.stroke();
    const off = (y/32)%2 ? 16 : 0;
    for(let x = off; x < 256; x += 32){
      g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+32); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   КАРТА (арабский стиль)
============================================================ */
const wallMeshes = [];      // для raycast (только здания)
const colliders = [];        // { minX, maxX, minZ, maxZ } для коллизий

const ARENA = 20;            // половина арены (40×40)

/* пол */
const sandTex = makeSandTex();
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2, ARENA*2),
  new THREE.MeshStandardMaterial({ map: sandTex, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* строительные блоки */
function addBuilding(cx, cz, w, d, h, baseColor){
  const tex = makeStoneTex(baseColor);
  tex.repeat.set(w/4, h/4);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0.02 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(cx, h/2, cz);
  scene.add(mesh);
  wallMeshes.push(mesh);
  colliders.push({
    minX: cx - w/2, maxX: cx + w/2,
    minZ: cz - d/2, maxZ: cz + d/2
  });
  return mesh;
}

/* периметр */
addBuilding(0, -ARENA, ARENA*2, 1.2, 4.5, '#c9a878');
addBuilding(0,  ARENA, ARENA*2, 1.2, 4.5, '#c9a878');
addBuilding(-ARENA, 0, 1.2, ARENA*2, 4.5, '#c9a878');
addBuilding( ARENA, 0, 1.2, ARENA*2, 4.5, '#c9a878');

/* центральное здание с "аркой" */
addBuilding(-3.5, -6, 1, 6, 4.2, '#d4b896');
addBuilding( 3.5, -6, 1, 6, 4.2, '#d4b896');
addBuilding(0,   -9, 8, 1, 4.2, '#d4b896');   // задняя стена
addBuilding(0,   -3, 8, 1, 1.2, '#d4b896');   // перемычка арки (высокая)

/* боковые здания */
addBuilding(-13, -10, 5, 5, 4, '#c9a878');
addBuilding( 13, -10, 5, 5, 4, '#c9a878');
addBuilding(-13,  10, 5, 5, 4, '#c9a878');
addBuilding( 13,  10, 5, 5, 4, '#c9a878');

/* длинные стены */
addBuilding(-16, 0, 1, 8, 3, '#bfa070');
addBuilding( 16, 0, 1, 8, 3, '#bfa070');
addBuilding(0, -16, 8, 1, 3, '#bfa070');
addBuilding(0,  16, 8, 1, 3, '#bfa070');

/* минарет — декоративная башня */
const minaretBase = addBuilding(15, 15, 3, 3, 9, '#d9bc94');
const minaretTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1.2, 1.2, 2, 12),
  new THREE.MeshStandardMaterial({ color: 0xd9bc94, roughness: 0.9 })
);
minaretTop.position.set(15, 10, 15);
scene.add(minaretTop);
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(1.4, 16, 12, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.5, metalness: 0.3 })
);
dome.position.set(15, 11.2, 15);
scene.add(dome);

/* ящики (укрытие) */
const crateMat = new THREE.MeshStandardMaterial({ color: 0x7a4a20, roughness: 0.95 });
const crateMat2 = new THREE.MeshStandardMaterial({ color: 0x8a5a2a, roughness: 0.9 });

function addCrate(x, z, s = 1, mat = crateMat){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mat);
  mesh.position.set(x, s/2, z);
  mesh.rotation.y = rnd(0, Math.PI);
  scene.add(mesh);
  wallMeshes.push(mesh);
  colliders.push({
    minX: x - s/2, maxX: x + s/2,
    minZ: z - s/2, maxZ: z + s/2
  });
}

addCrate(-9, -3, 1.4, crateMat);
addCrate(-8, -4.5, 1.2, crateMat2);
addCrate(9, 4, 1.4, crateMat);
addCrate(8, 5.5, 1.2, crateMat2);
addCrate(0, 5, 1.5, crateMat);
addCrate(-3, 9, 1.3, crateMat2);
addCrate(3, -11, 1.3, crateMat);
addCrate(-11, 4, 1.3, crateMat2);
addCrate(11, -4, 1.3, crateMat);

/* пальмы */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a28, roughness: 1 });
const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });

function addPalm(x, z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 4.5, 6), trunkMat);
  trunk.position.y = 2.25;
  g.add(trunk);
  for(let i = 0; i < 6; i++){
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.35, 2.2, 5), leafMat);
    const a = (i/6) * Math.PI * 2;
    leaf.position.set(Math.cos(a)*0.6, 4.6, Math.sin(a)*0.6);
    leaf.rotation.z = -Math.cos(a) * 1.1;
    leaf.rotation.x = Math.sin(a) * 1.1;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
addPalm(-18, -18);
addPalm(18, -18);
addPalm(-18, 18);
addPalm(-14, -2);

/* декоративный ковёр */
const rug = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 3),
  new THREE.MeshStandardMaterial({ color: 0x8a1a1a, roughness: 0.9 })
);
rug.rotation.x = -Math.PI/2;
rug.position.set(0, 0.02, 0);
scene.add(rug);
const rugBorder = new THREE.Mesh(
  new THREE.PlaneGeometry(4.2, 3.2),
  new THREE.MeshStandardMaterial({ color: 0xffc107, roughness: 0.9 })
);
rugBorder.rotation.x = -Math.PI/2;
rugBorder.position.set(0, 0.01, 0);
scene.add(rugBorder);

/* ============================================================
   ОРУЖИЕ — параметры
============================================================ */
const WEAPONS = {
  ak: {
    name: 'АК-47', dmg: 28, rate: 105, mag: 30, reload: 2200,
    spread: 0.014, auto: true, range: 100, melee: false,
    sound: 'ak', kick: 0.03
  },
  awp: {
    name: 'AWP', dmg: 100, rate: 1200, mag: 5, reload: 2800,
    spread: 0.0008, auto: false, range: 200, melee: false,
    sound: 'awp', kick: 0.12
  },
  knife: {
    name: 'НОЖ', dmg: 65, rate: 420, mag: Infinity, reload: 0,
    spread: 0, auto: false, range: 2.5, melee: true,
    sound: 'knife', kick: 0
  }
};
const WEAPON_ORDER = ['ak', 'awp', 'knife'];

/* ============================================================
   ИГРОК
============================================================ */
const player = {
  pos: new THREE.Vector3(0, 1.65, 15),
  velY: 0,
  onGround: true,
  yaw: Math.PI,
  pitch: 0,
  hp: 100, maxHp: 100,
  alive: true,
  weapon: 'ak',
  ammo: { ak: 30, awp: 5, knife: Infinity },
  lastShot: 0,
  reloading: false,
  reloadEnd: 0,
  kills: 0,
  bobT: 0,
  recoil: 0,
  _semiLatch: false,
};

const PLAYER_RADIUS = 0.4;

function resolveCollisions(pos){
  for(const c of colliders){
    const cx = clamp(pos.x, c.minX, c.maxX);
    const cz = clamp(pos.z, c.minZ, c.maxZ);
    let dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < PLAYER_RADIUS*PLAYER_RADIUS){
      if(d2 > 1e-6){
        const d = Math.sqrt(d2);
        pos.x = cx + (dx/d) * PLAYER_RADIUS;
        pos.z = cz + (dz/d) * PLAYER_RADIUS;
      } else {
        const dl = pos.x - c.minX, dr = c.maxX - pos.x;
        const dt = pos.z - c.minZ, db = c.maxZ - pos.z;
        const m = Math.min(dl, dr, dt, db);
        if(m === dl) pos.x = c.minX - PLAYER_RADIUS;
        else if(m === dr) pos.x = c.maxX + PLAYER_RADIUS;
        else if(m === dt) pos.z = c.minZ - PLAYER_RADIUS;
        else pos.z = c.maxZ + PLAYER_RADIUS;
      }
    }
  }
  const B = ARENA - 1;
  pos.x = clamp(pos.x, -B, B);
  pos.z = clamp(pos.z, -B, B);
}

const raycaster = new THREE.Raycaster();

function addTracer(from, to, color = 0xffe066){

  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const line = new THREE.Line(geo, mat);

}

function tryShoot(){
  if(!player.alive || gameState !== 'playing') return;
  const w = WEAPONS[player.weapon];
  const now = performance.now();

  if(player.reloading) return;
  if(!w.melee && player.ammo[player.weapon] <= 0){ reload(); return; }
  if(now - player.lastShot < w.rate) return;

  player.lastShot = now;
  if(!w.melee) player.ammo[player.weapon]--;

  if(w.melee){
    // ближний бой — конус
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const toBot = bot.pos.clone().setY(1.2).sub(camera.position);
    const dist = toBot.length();
    if(bot.alive && dist < w.range){
      toBot.normalize();
      const dot = dir.dot(toBot);
      if(dot > 0.6){
        damageBot(w.dmg, false);
        sfx('hit');
      }
    }
    sfx('knife');
    player.recoil = 0.05;
    updateHUD();
    return;
  }

  // рейкаст
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.x += (Math.random()-0.5) * w.spread;
  dir.y += (Math.random()-0.5) * w.spread;
  dir.z += (Math.random()-0.5) * w.spread;
  dir.normalize();

  raycaster.set(origin, dir);
  raycaster.far = w.range;

  const wallHits = raycaster.intersectObjects(wallMeshes);
  const wallDist = wallHits.length ? wallHits[0].distance : Infinity;

  const botHits = bot.alive ? raycaster.intersectObjects(botHitMeshes) : [];
  const botDist = botHits.length ? botHits[0].distance : Infinity;

  const endDist = Math.min(wallDist, botDist, w.range);
  const end = origin.clone().addScaledVector(dir, endDist);
  addTracer(origin, end);
  muzzleFlash();
  sfx(w.sound);

  if(botDist < wallDist && botDist < w.range && bot.alive){
    const isHead = botHits[0].object.userData.isHead;
    damageBot(w.dmg, isHead);
    sfx('hit');
  }

  player.recoil = w.kick;
  player.ammo[player.weapon] = Math.max(0, player.ammo[player.weapon]);
  updateHUD();
}

function reload(){
  const w = WEAPONS[player.weapon];
  if(w.melee || player.reloading) return;
  if(player.ammo[player.weapon] >= w.mag) return;
  player.reloading = true;
  player.reloadEnd = performance.now() + w.reload;
  sfx('reload');
  updateHUD();
}

  player.weapon = w;

}

const botTmp = new THREE.Vector3();

function botHasLOS(){
  const from = bot.pos.clone().setY(1.6);
  const to = player.pos.clone();
  const dir = to.clone().sub(from);
  const dist = dir.length();
  dir.normalize();
  raycaster.set(from, dir);
  raycaster.far = dist;
  const hits = raycaster.intersectObjects(wallMeshes);
  return hits.length === 0;
}

function updateBot(dt){
  if(!bot.alive){
    bot.respawnT -= dt;
    if(bot.respawnT <= 0){
      respawnBot();
    }
    return;
  }

  if(bot.hitFlash > 0) bot.hitFlash -= dt;
  botClothMat.emissive.setHex(bot.hitFlash > 0 ? 0x553333 : 0x220000);

  const now = performance.now();
  const dx = player.pos.x - bot.pos.x;
  const dz = player.pos.z - bot.pos.z;
  const dist = Math.hypot(dx, dz);

  // поворот к игроку
  const targetYaw = Math.atan2(dx, dz);
  let dYaw = targetYaw - bot.yaw;
  while(dYaw > Math.PI) dYaw -= Math.PI*2;
  while(dYaw < -Math.PI) dYaw += Math.PI*2;
  bot.yaw += dYaw * Math.min(1, dt * 8);

  const los = botHasLOS();
  let mx = 0, mz = 0;

  if(los){
    if(dist > 12){
      mx = dx/dist;
      mz = dz/dist;
    } else if(dist < 5){
      mx = -dx/dist * 0.6;
      mz = -dz/dist * 0.6;
    } else {
      if(now > bot.nextStrafe){
        bot.strafeDir = Math.random() < 0.5 ? 1 : -1;
        bot.nextStrafe = now + 1400 + Math.random()*1200;
      }
      mx = -dz/dist * bot.strafeDir * 0.7;
      mz =  dx/dist * bot.strafeDir * 0.7;
    }
  } else {
    // двигаемся к игроку (грубо, "в лоб")
    mx = dx/dist;
    mz = dz/dist;
  }

  const speed = 3.0;
  bot.pos.x += mx * speed * dt;
  bot.pos.z += mz * speed * dt;
  resolveCollisions(bot.pos);

  // стрельба
  if(los && dist < 65 && player.alive){
    const interval = 550 + Math.random() * 400;
    if(now - bot.lastShot > interval){
      bot.lastShot = now;
      // визуальный выстрел
      const botEye = bot.pos.clone().setY(1.6);
      const pEye = player.pos.clone();
      const bdir = pEye.sub(botEye).normalize();
      const endPt = botEye.clone().addScaledVector(bdir, Math.min(dist, 20));
      addTracer(botEye, endPt, 0xff6b6b);
      sfx('ak');

      // точность
      const acc = Math.max(0.18, 0.75 - dist * 0.012);
      if(Math.random() < acc){
        const dmg = rnd(9, 18);
        damagePlayer(dmg);
      }
    }
  }

  // обновление меша
  botGroup.position.copy(bot.pos);
  botGroup.rotation.y = bot.yaw;

  // анимация ног
  const walkPhase = now * 0.008;
  botLegL.rotation.x = Math.sin(walkPhase) * 0.3 * (Math.hypot(mx, mz) > 0.1 ? 1 : 0);
  botLegR.rotation.x = -botLegL.rotation.x;
}

function damageBot(dmg, isHead){
  if(!bot.alive) return;
  const final = isHead ? dmg * 2 : dmg;
  bot.hp -= final;
  bot.hitFlash = 0.12;
  showHitmarker();
  showKillfeed((isHead ? 'HEADSHOT! ' : '') + '-' + Math.round(final) + ' HP', isHead ? '#ffc107' : '#ff8888');

  if(bot.hp <= 0){
    onBotDeath();
  }
}

const joyEl = document.getElementById('joy');
const knobEl = joyEl.querySelector('.knob');
const joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };

function joyCenter(){
  const r = joyEl.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2, R: r.width/2 };
}

joyEl.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  if(joy.active) return;
  const t = e.changedTouches[0];
  const c = joyCenter();
  joy.active = true;
  joy.id = t.identifier;
  joy.bx = c.x; joy.by = c.y;
  joy.dx = 0; joy.dy = 0;
}, { passive: false });

joyEl.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){
      const c = joyCenter();
      const dx = t.clientX - c.x;
      const dy = t.clientY - c.y;
      const d = Math.hypot(dx, dy);
      const k = d > c.R ? c.R/d : 1;
      joy.dx = (dx*k) / c.R;
      joy.dy = (dy*k) / c.R;
      knobEl.style.left = (50 + joy.dx * 45) + '%';
      knobEl.style.top  = (50 + joy.dy * 45) + '%';
    }
  }
}, { passive: false });

function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){
      joy.active = false; joy.id = null;
      joy.dx = 0; joy.dy = 0;
      knobEl.style.left = '50%';
      knobEl.style.top  = '50%';
    }
  }
}
joyEl.addEventListener('touchend', joyEnd);

  // перезарядка
  if(player.reloading && performance.now() >= player.reloadEnd){
    player.reloading = false;
    player.ammo[player.weapon] = WEAPONS[player.weapon].mag;

  if(joy.active){
    fw += -joy.dy;
    st +=  joy.dx;
  }
  const mag = Math.hypot(fw, st);
  if(mag > 1){ fw /= mag; st /= mag; }

  const speed = 5.2;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  player.pos.x += (fwd.x * fw + right.x * st) * speed * dt;
  player.pos.z += (fwd.z * fw + right.z * st) * speed * dt;
  resolveCollisions(player.pos);

  // прыжок / гравитация
  player.velY -= 18 * dt;
  player.pos.y += player.velY * dt;
  if(player.pos.y <= 1.65){
    player.pos.y = 1.65;
    player.velY = 0;
    player.onGround = true;
  }

  // стрельба
  const w = WEAPONS[player.weapon];
  if(shooting){
    if(w.auto) tryShoot();
    else if(!player._semiLatch){ tryShoot(); player._semiLatch = true; }
  } else {
    player._semiLatch = false;
  }

  // камера + покачивание
  player.bobT += dt * (mag > 0.1 ? 10 : 3);
  const bob = mag > 0.1 ? Math.sin(player.bobT) * 0.025 : 0;
  camera.position.set(player.pos.x, player.pos.y + bob, player.pos.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // отдача
  if(player.recoil > 0){
    camera.rotation.x += player.recoil;
    player.recoil *= 0.75;
    if(player.recoil < 0.001) player.recoil = 0;
  }

  // анимация оружия
  gunHolder.position.y = bob * 0.5;
  gunHolder.position.x = Math.cos(player.bobT * 0.5) * bob * 0.3;
}

/* ============================================================
   ЦИКЛ
============================================================ */
function cleanupTracers(){
  const now = performance.now();
  for(let i = tracers.length - 1; i >= 0; i--){
    if(now - tracers[i].t > 120){
      scene.remove(tracers[i].line);
      tracers[i].line.geometry.dispose();
      tracers[i].line.material.dispose();
      tracers.splice(i, 1);
    }
  }
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(gameState === 'playing'){
    updatePlayer(dt);
    updateBot(dt);
  }

  cleanupTracers();
  renderer.render(scene, camera);
}

/* ============================================================
   СТАРТ
============================================================ */
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.add('on');
  if(isTouch) document.getElementById('touch').classList.add('on');
  gameState = 'playing';
  respawnPlayer();
  respawnBot();
  updateHUD();
  if(!isTouch) setTimeout(() => canvas.requestPointerLock(), 100);
});

updateHUD();
requestAnimationFrame(loop);
</script>
