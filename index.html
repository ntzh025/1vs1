<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mirage 1v1 — Modern</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,0.38) 100%);
  mix-blend-mode:multiply;}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;}
#hud.on{display:block;}

#crosshair{position:absolute;left:50%;top:50%;width:24px;height:24px;
  transform:translate(-50%,-50%);transition:opacity .12s;}
#crosshair .h,#crosshair .v{position:absolute;background:#7ee787;
  box-shadow:0 0 6px rgba(126,231,135,.95);transition:all .15s;}
#crosshair .h{left:0;top:50%;width:100%;height:2px;transform:translateY(-50%);}
#crosshair .v{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
#crosshair .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;
  background:#ff4d4d;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 8px #ff4d4d;transition:all .15s;}
#crosshair.ads .h,#crosshair.ads .v{background:#fff;opacity:.5;}

#scope{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;opacity:0;
  transition:opacity .08s;
  background:radial-gradient(circle at 50% 50%,
    transparent 0,transparent 30vmin,
    rgba(0,0,0,.97) 32vmin,#000 100%);}
#scope.on{display:block;}
.scope-ring{position:absolute;left:50%;top:50%;width:62vmin;height:62vmin;
  transform:translate(-50%,-50%);border-radius:50%;
  box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.8);
  border:2px solid rgba(0,0,0,.6);}
.scope-h,.scope-v{position:absolute;background:rgba(0,0,0,.85);}
.scope-h{left:50%;top:50%;width:62vmin;height:1.5px;transform:translate(-50%,-50%);}
.scope-v{left:50%;top:50%;width:1.5px;height:62vmin;transform:translate(-50%,-50%);}
.scope-dot{position:absolute;left:50%;top:50%;width:5px;height:5px;
  background:#ff2222;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 8px #ff2222;}

.panel{position:absolute;background:rgba(10,15,25,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);border-radius:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);}
#hp-panel{left:20px;bottom:20px;padding:10px 16px;display:flex;align-items:baseline;gap:6px;}
#hp-panel .val{font-size:32px;font-weight:900;color:#3ddc84;
  text-shadow:0 2px 8px rgba(61,220,132,.5);}
#hp-panel .lbl{font-size:13px;color:#8fa4bd;letter-spacing:1px;}
#ammo-panel{right:20px;bottom:20px;padding:10px 16px;
  display:flex;flex-direction:column;align-items:flex-end;}
#ammo-panel .weapon{font-size:11px;color:#ffc107;letter-spacing:2px;margin-bottom:4px;}
#ammo-panel .ammo{font-size:28px;font-weight:900;color:#fff;}
#ammo-panel .ammo small{font-size:14px;color:#8fa4bd;font-weight:600;}
#kills-panel{left:20px;top:20px;padding:10px 16px;font-size:14px;}
#kills-panel .row{display:flex;gap:12px;}
#kills-panel .you{color:#4dabf7;}
#kills-panel .bot{color:#ff6b6b;}
#kills-panel b{font-size:18px;}

#hitmarker{position:absolute;left:50%;top:50%;width:22px;height:22px;
  transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .1s;}
#hitmarker::before,#hitmarker::after{content:'';position:absolute;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.8);}
#hitmarker::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
#hitmarker::after{left:0;top:50%;width:100%;height:2px;transform:translateY(-50%);}
#hitmarker.on{opacity:1;}
#hitmarker.head::before,#hitmarker.head::after{background:#ffc107;
  box-shadow:0 0 8px #ffc107;}

#killfeed{position:absolute;left:50%;top:22px;transform:translateX(-50%);
  font-size:15px;font-weight:800;text-align:center;padding:8px 20px;
  background:rgba(10,15,25,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-radius:30px;
  opacity:0;transition:opacity .3s;letter-spacing:1px;white-space:nowrap;}
#killfeed.on{opacity:1;}

#deadmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(24px,7vw,44px);font-weight:900;color:#ff4d4d;display:none;
  text-align:center;letter-spacing:3px;
  text-shadow:0 4px 30px rgba(0,0,0,.95),0 0 40px rgba(255,77,77,.5);}
#deadmsg.on{display:block;}

#damage-flash{position:absolute;inset:0;
  background:radial-gradient(circle,rgba(255,0,0,0) 40%,rgba(255,0,0,.7) 100%);
  opacity:0;transition:opacity .1s;pointer-events:none;}

#touch{position:fixed;inset:0;pointer-events:none;z-index:6;display:none;}
#touch.on{display:block;}
#joy{position:absolute;left:22px;bottom:22px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#joy .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,rgba(126,231,135,.7),rgba(126,231,135,.4));
  border:2px solid rgba(126,231,135,.9);transform:translate(-50%,-50%);
  pointer-events:none;box-shadow:0 0 20px rgba(126,231,135,.4);}
#look-zone{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;}
.tbtn{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.28);color:#fff;display:flex;
  align-items:center;justify-content:center;pointer-events:auto;font-weight:900;
  touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .1s,background .1s;}
.tbtn:active{background:rgba(255,255,255,.25);transform:scale(.94);}
#btn-fire{right:20px;bottom:20px;width:96px;height:96px;font-size:38px;
  background:rgba(255,77,77,.28);border-color:rgba(255,77,77,.6);}
#btn-fire.active{background:rgba(255,77,77,.55);}
#btn-ads{right:130px;bottom:20px;width:76px;height:76px;font-size:28px;
  background:rgba(77,171,247,.28);border-color:rgba(77,171,247,.6);}
#btn-ads.active{background:rgba(77,171,247,.6);}
#btn-reload{right:130px;bottom:108px;width:58px;height:58px;font-size:24px;}
#btn-weapon{right:24px;bottom:130px;width:58px;height:58px;font-size:24px;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px;z-index:10;
  background:radial-gradient(circle at 50% 30%,#2a1f14,#0a0705 78%);overflow-y:auto;}
.screen.hidden{display:none;}
h1{font-size:clamp(32px,9vw,58px);letter-spacing:8px;font-weight:900;
  background:linear-gradient(90deg,#ffc107,#ff8b3d,#ff4d4d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;filter:drop-shadow(0 4px 30px rgba(255,139,61,.5));}
.sub{font-size:13px;color:#c9a878;max-width:440px;text-align:center;
  line-height:1.6;letter-spacing:.5px;}
.weapons-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.weapon-badge{padding:10px 18px;border-radius:12px;font-size:12px;
  font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.14);color:#c9d4e3;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.controls-hint{font-size:12px;color:#8fa4bd;max-width:440px;text-align:center;
  line-height:1.8;background:rgba(0,0,0,.4);padding:14px 20px;border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.controls-hint b{color:#ffc107;}
button.primary{font-family:inherit;cursor:pointer;border:none;border-radius:14px;
  padding:18px 44px;font-size:18px;font-weight:900;letter-spacing:2px;
  color:#04121f;background:linear-gradient(180deg,#ffc107,#ff8b3d);
  box-shadow:0 8px 32px rgba(255,139,61,.5);transition:.15s;text-transform:uppercase;}
button.primary:active{transform:scale(.96);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="scope">
  <div class="scope-ring"></div>
  <div class="scope-h"></div>
  <div class="scope-v"></div>
  <div class="scope-dot"></div>
</div>

<div id="hud">
  <div id="damage-flash"></div>
  <div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>
  <div id="hitmarker"></div>
  <div class="panel" id="hp-panel"><span class="val">100</span><span class="lbl">HP</span></div>
  <div class="panel" id="ammo-panel">
    <div class="weapon">АК-47</div>
    <div class="ammo">30<small>/ 30</small></div>
  </div>
  <div class="panel" id="kills-panel">
    <div class="row">
      <div class="you">Вы <b>0</b></div>
      <div class="bot">Бот <b>0</b></div>
    </div>
  </div>
  <div id="killfeed"></div>
  <div id="deadmsg">ВЫ ПОГИБЛИ</div>
</div>

<div id="touch">
  <div id="joy"><div class="knob"></div></div>
  <div id="look-zone"></div>
  <button id="btn-fire" class="tbtn">🔥</button>
  <button id="btn-ads" class="tbtn">🎯</button>
  <button id="btn-reload" class="tbtn">⟳</button>
  <button id="btn-weapon" class="tbtn">⇄</button>
</div>

<div id="menu" class="screen">
  <h1>MIRAGE 1v1</h1>
  <p class="sub">Современный тактический FPS. Карта в арабском стиле. Победи бота.</p>
  <div class="weapons-row">
    <div class="weapon-badge" style="border-color:#ffc107;color:#ffc107">AK-47</div>
    <div class="weapon-badge" style="border-color:#4dabf7;color:#4dabf7">AWP</div>
    <div class="weapon-badge" style="border-color:#ff6b6b;color:#ff6b6b">НОЖ</div>
  </div>
  <div class="controls-hint" id="hint"></div>
  <button id="startBtn" class="primary">В БОЙ</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
document.getElementById('hint').innerHTML = isTouch
  ? '<b>Джойстик слева</b> — движение · <b>Свайп справа</b> — обзор · <b>🔥</b> — огонь · <b>🎯</b> — прицел · <b>⟳</b> — перезарядка · <b>⇄</b> — оружие'
  : '<b>WASD</b> — движение · <b>Мышь</b> — обзор · <b>ЛКМ</b> — огонь · <b>ПКМ</b> — прицел · <b>R</b> — перезарядка · <b>1/2/3</b> — оружие · <b>Space</b> — прыжок';

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;

/* АУДИО */
let actx=null;
function initAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function sfx(type){
  if(!actx)return;
  const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  const c={
    ak:{type:'square',f0:220,f1:50,dur:.09,vol:.055},
    awp:{type:'sawtooth',f0:140,f1:40,dur:.25,vol:.13},
    knife:{type:'triangle',f0:800,f1:300,dur:.1,vol:.08},
    hit:{type:'triangle',f0:950,f1:400,dur:.08,vol:.07},
    reload:{type:'sine',f0:400,f1:600,dur:.16,vol:.05},
    death:{type:'sawtooth',f0:400,f1:60,dur:.55,vol:.14},
  }[type];
  if(!c)return;
  o.type=c.type;
  o.frequency.setValueAtTime(c.f0,t);
  if(type==='reload'){
    o.frequency.setValueAtTime(c.f0,t);
    o.frequency.setValueAtTime(c.f1,t+.07);
  }else{
    o.frequency.exponentialRampToValueAtTime(c.f1,t+c.dur);
  }
  g.gain.setValueAtTime(c.vol,t);
  g.gain.exponentialRampToValueAtTime(.001,t+c.dur+.02);
  o.start(t);o.stop(t+c.dur+.05);
}

/* СЦЕНА */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const FOG=0xd8c4a0;
scene.fog=new THREE.Fog(FOG,30,100);

const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.05,200);
camera.rotation.order='YXZ';
scene.add(camera);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

/* ОСВЕЩЕНИЕ */
scene.add(new THREE.HemisphereLight(0x88bbff,0x8b6b3e,.9));
const sun=new THREE.DirectionalLight(0xfff2c8,3.2);
sun.position.set(20,35,15);
sun.castShadow=true;
const shSize=isTouch?1024:2048;
sun.shadow.mapSize.set(shSize,shSize);
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;
sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.camera.near=1;sun.shadow.camera.far=90;
sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x88aaff,.5);
fill.position.set(-18,15,-18);scene.add(fill);

/* НЕБО */
function makeSkyTex(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#4a7bb8');gr.addColorStop(.4,'#8fb8d8');
  gr.addColorStop(.75,'#e8d4a8');gr.addColorStop(1,'#f0d8a8');
  g.fillStyle=gr;g.fillRect(0,0,1024,512);
  const sg=g.createRadialGradient(180,140,10,180,140,260);
  sg.addColorStop(0,'rgba(255,250,200,1)');
  sg.addColorStop(.3,'rgba(255,240,180,.6)');
  sg.addColorStop(1,'rgba(255,240,180,0)');
  g.fillStyle=sg;g.fillRect(0,0,1024,512);
  for(let i=0;i<25;i++){
    g.fillStyle=`rgba(255,255,255,${rnd(.1,.35)})`;
    g.beginPath();g.ellipse(rnd(0,1024),rnd(60,220),rnd(40,120),rnd(8,22),0,0,7);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const skyMesh=new THREE.Mesh(
  new THREE.SphereGeometry(150,32,16),
  new THREE.MeshBasicMaterial({map:makeSkyTex(),side:THREE.BackSide,fog:false})
);
scene.add(skyMesh);

/* ТЕКСТУРЫ */
function makeSandTex(){
  const c=document.createElement('canvas');c.width=c.height=1024;
  const g=c.getContext('2d');
  g.fillStyle='#c9a878';g.fillRect(0,0,1024,1024);
  for(let i=0;i<40;i++){
    g.fillStyle=`rgba(${180+rnd(0,40)|0},${150+rnd(0,40)|0},${100+rnd(0,40)|0},.15)`;
    g.beginPath();g.ellipse(Math.random()*1024,Math.random()*1024,rnd(30,150),rnd(30,120),Math.random()*6,0,7);g.fill();
  }
  for(let i=0;i<8000;i++){
    g.fillStyle=Math.random()>.5?'rgba(120,90,60,.25)':'rgba(220,200,170,.2)';
    g.fillRect(Math.random()*1024,Math.random()*1024,rnd(1,3),rnd(1,3));
  }
  g.strokeStyle='rgba(90,70,50,.3)';g.lineWidth=3;
  for(let i=0;i<=1024;i+=128){
    g.beginPath();g.moveTo(i,0);g.lineTo(i,1024);g.stroke();
    g.beginPath();g.moveTo(0,i);g.lineTo(1024,i);g.stroke();
  }
  g.strokeStyle='rgba(60,40,30,.4)';g.lineWidth=1.5;
  for(let i=0;i<15;i++){
    g.beginPath();
    let x=Math.random()*1024,y=Math.random()*1024;g.moveTo(x,y);
    for(let j=0;j<6;j++){x+=rnd(-30,30);y+=rnd(-30,30);g.lineTo(x,y);}
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,10);
  t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeStoneTex(base){
  const c=document.createElement('canvas');c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,512,512);
  for(let i=0;i<3000;i++){
    g.fillStyle=`rgba(${100+rnd(0,60)|0},${80+rnd(0,50)|0},${50+rnd(0,40)|0},.18)`;
    g.fillRect(Math.random()*512,Math.random()*512,rnd(1,4),rnd(1,4));
  }
  g.strokeStyle='rgba(60,40,25,.35)';g.lineWidth=2;
  const bh=32,bw=64;
  for(let y=0;y<512;y+=bh){
    const off=(y/bh)%2?bw/2:0;
    g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke();
    for(let x=-off;x<512;x+=bw){
      g.beginPath();g.moveTo(x+off,y);g.lineTo(x+off,y+bh);g.stroke();
    }
  }
  for(let i=0;i<8;i++){
    g.strokeStyle='rgba(40,25,15,.4)';g.lineWidth=1.5;
    g.beginPath();
    let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);
    for(let j=0;j<5;j++){x+=rnd(-25,25);y+=rnd(-25,25);g.lineTo(x,y);}
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* КАРТА */
const wallMeshes=[];
const colliders=[];
const ARENA=20;

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2,ARENA*2),
  new THREE.MeshStandardMaterial({map:makeSandTex(),roughness:.95,metalness:.02})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function addBuilding(cx,cz,w,d,h,baseColor){
  const tex=makeStoneTex(baseColor);
  tex.repeat.set(w/3,h/3);
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.85,metalness:.05});
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.position.set(cx,h/2,cz);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);
  wallMeshes.push(mesh);
  colliders.push({minX:cx-w/2,maxX:cx+w/2,minZ:cz-d/2,maxZ:cz+d/2});
  return mesh;
}

addBuilding(0,-ARENA,ARENA*2,1.2,4.5,'#c9a878');
addBuilding(0,ARENA,ARENA*2,1.2,4.5,'#c9a878');
addBuilding(-ARENA,0,1.2,ARENA*2,4.5,'#c9a878');
addBuilding(ARENA,0,1.2,ARENA*2,4.5,'#c9a878');

addBuilding(-3.5,-6,1,6,4.2,'#d4b896');
addBuilding(3.5,-6,1,6,4.2,'#d4b896');
addBuilding(0,-9,8,1,4.2,'#d4b896');
addBuilding(0,-3,8,1,1.2,'#d4b896');

addBuilding(-13,-10,5,5,4,'#c9a878');
addBuilding(13,-10,5,5,4,'#c9a878');
addBuilding(-13,10,5,5,4,'#c9a878');
addBuilding(13,10,5,5,4,'#c9a878');

addBuilding(-16,0,1,8,3,'#bfa070');
addBuilding(16,0,1,8,3,'#bfa070');
addBuilding(0,-16,8,1,3,'#bfa070');
addBuilding(0,16,8,1,3,'#bfa070');

addBuilding(15,15,3,3,9,'#d9bc94');
const minTop=new THREE.Mesh(
  new THREE.CylinderGeometry(1.2,1.2,2,12),
  new THREE.MeshStandardMaterial({color:0xd9bc94,roughness:.85})
);

const PR=.4;
function resolveCollisions(pos){
  for(const c of colliders){
    const cx=clamp(pos.x,c.minX,c.maxX),cz=clamp(pos.z,c.minZ,c.maxZ);
    let dx=pos.x-cx,dz=pos.z-cz;
    const d2=dx*dx+dz*dz;
    if(d2<PR*PR){
      if(d2>1e-6){
        const d=Math.sqrt(d2);
        pos.x=cx+(dx/d)*PR;pos.z=cz+(dz/d)*PR;
      }else{
        const dl=pos.x-c.minX,dr=c.maxX-pos.x,dt=pos.z-c.minZ,db=c.maxZ-pos.z;
        const m=Math.min(dl,dr,dt,db);
        if(m===dl)pos.x=c.minX-PR;
        else if(m===dr)pos.x=c.maxX+PR;
        else if(m===dt)pos.z=c.minZ-PR;
        else pos.z=c.maxZ+PR;
      }
    }
  }
  const B=ARENA-1;
  pos.x=clamp(pos.x,-B,B);pos.z=clamp(pos.z,-B,B);
}

function tryShoot(){
  if(!player.alive||gameState!=='playing')return;
  const w=WEAPONS[player.weapon];
  const now=performance.now();
  if(player.reloading)return;
  if(!w.melee&&player.ammo[player.weapon]<=0){reload();return;}
  if(now-player.lastShot<w.rate)return;
  player.lastShot=now;
  if(!w.melee)player.ammo[player.weapon]--;

  if(w.melee){
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    const toBot=bot.pos.clone().setY(1.2).sub(camera.position);
    const d=toBot.length();
    if(bot.alive&&d<w.range){
      toBot.normalize();
      if(dir.dot(toBot)>.55)damageBot(w.dmg,false);
    }
    sfx('knife');player.recoil=.05;updateHUD();return;
  }

  const origin=camera.position.clone();
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const spread=w.spread*(1-player.adsAmount*.7);
  dir.x+=(Math.random()-.5)*spread;
  dir.y+=(Math.random()-.5)*spread;
  dir.z+=(Math.random()-.5)*spread;
  dir.normalize();

  raycaster.set(origin,dir);raycaster.far=w.range;
  const wallHits=raycaster.intersectObjects(wallMeshes);
  const wallDist=wallHits.length?wallHits[0].distance:Infinity;
  const botHits=bot.alive?raycaster.intersectObjects(botHitMeshes):[];
  const botDist=botHits.length?botHits[0].distance:Infinity;
  const endDist=Math.min(wallDist,botDist,w.range);
  const end=origin.clone().addScaledVector(dir,endDist);
  addTracer(origin,end);

  const muzzlePos=origin.clone().addScaledVector(dir,.6);
  fireMuzzleFlash(muzzlePos);
  sfx(w.sound);

  if(wallDist<botDist&&wallDist<w.range)spawnSparks(wallHits[0].point);
  if(botDist<wallDist&&botDist<w.range&&bot.alive){
    const isHead=botHits[0].object.userData.isHead;
    damageBot(w.dmg,isHead);
    sfx('hit');showHitmarker(isHead);
  }
  player.recoil=w.kick*(1-player.adsAmount*.5);
  updateHUD();
}

function botHasLOS(){
  const from=bot.pos.clone().setY(1.6);
  const to=player.pos.clone();
  const d=to.clone().sub(from);const dist=d.length();d.normalize();
  raycaster.set(from,d);raycaster.far=dist;
  return raycaster.intersectObjects(wallMeshes).length===0;
}
function updateBot(dt){
  if(!bot.alive){
    bot.respawnT-=dt;
    if(bot.respawnT<=0)respawnBot();
    return;
  }
  if(bot.hitFlash>0){
    bot.hitFlash-=dt;
    botClothMat.emissive.setHex(bot.hitFlash>0?0x662222:0x150000);
  }
  const now=performance.now();
  const dx=player.pos.x-bot.pos.x,dz=player.pos.z-bot.pos.z;
  const dist=Math.hypot(dx,dz);
  const tYaw=Math.atan2(dx,dz);
  let dY=tYaw-bot.yaw;
  while(dY>Math.PI)dY-=Math.PI*2;
  while(dY<-Math.PI)dY+=Math.PI*2;
  bot.yaw+=dY*Math.min(1,dt*8);

  const los=botHasLOS();
  let mx=0,mz=0;
  if(los){
    if(dist>12){mx=dx/dist;mz=dz/dist;}
    else if(dist<5){mx=-dx/dist*.6;mz=-dz/dist*.6;}
    else{
      if(now>bot.nextStrafe){
        bot.strafeDir=Math.random()<.5?1:-1;
        bot.nextStrafe=now+1400+Math.random()*1200;
      }
      mx=-dz/dist*bot.strafeDir*.7;mz=dx/dist*bot.strafeDir*.7;
    }
  }else{mx=dx/dist;mz=dz/dist;}

  const speed=3.0;
  bot.pos.x+=mx*speed*dt;bot.pos.z+=mz*speed*dt;
  resolveCollisions(bot.pos);

  if(los&&dist<65&&player.alive){
    const interval=550+Math.random()*400;
    if(now-bot.lastShot>interval){
      bot.lastShot=now;
      const bEye=bot.pos.clone().setY(1.6);
      const pEye=player.pos.clone();
      const bd=pEye.sub(bEye).normalize();
      const endP=bEye.clone().addScaledVector(bd,Math.min(dist,20));
      addTracer(bEye,endP,0xff6b6b);
      sfx('ak');
      const acc=Math.max(.18,.75-dist*.012);
      if(Math.random()<acc)damagePlayer(rnd(9,18));
    }
  }
  botGroup.position.copy(bot.pos);
  botGroup.rotation.y=bot.yaw;
  const moving=Math.hypot(mx,mz)>.1;
  bot.walkPhase+=dt*(moving?8:0);
  botLegL.rotation.x=Math.sin(bot.walkPhase)*.3;
  botLegR.rotation.x=-botLegL.rotation.x;
  botTorso.position.y=1.2+Math.sin(bot.walkPhase*2)*.02;
}
function damageBot(dmg,isHead){
  if(!bot.alive)return;
  const f=isHead?dmg*2:dmg;
  bot.hp-=f;bot.hitFlash=.12;
  if(bot.hp<=0)onBotDeath();
}
function onBotDeath(){
  bot.alive=false;bot.respawnT=3;botGroup.visible=false;
  player.kills++;updateKillsHUD();
  showKillfeed('ВЫ УБИЛИ БОТА!','#3ddc84');sfx('death');
  spawnSparks(bot.pos.clone().setY(1.2),20);
}
function respawnBot(){
  const spawns=[
    {x:0,z:-14},{x:0,z:14},{x:-14,z:0},{x:14,z:0},
    {x:-8,z:-8},{x:8,z:8},{x:-8,z:8},{x:8,z:-8}
  ];
  const s=spawns[Math.floor(Math.random()*spawns.length)];
  bot.pos.set(s.x,0,s.z);bot.hp=bot.maxHp;bot.alive=true;
  bot.lastShot=performance.now();botGroup.visible=true;
  showKillfeed('БОТ ВОЗРОДИЛСЯ','#ffc107');
}
function damagePlayer(dmg){
  if(!player.alive)return;
  player.hp-=dmg;
  document.getElementById('damage-flash').style.opacity='.7';
  setTimeout(()=>document.getElementById('damage-flash').style.opacity='0',140);
  if(player.hp<=0)onPlayerDeath();
  updateHUD();
}
let pRespT=null;
function onPlayerDeath(){
  player.alive=false;player.hp=0;player.deaths++;
  gunHolder.visible=false;setAiming(false);
  document.getElementById('deadmsg').classList.add('on');
  document.getElementById('deadmsg').textContent='ВЫ ПОГИБЛИ — 3...';
  sfx('death');updateKillsHUD();
  let n=3;clearInterval(pRespT);
  pRespT=setInterval(()=>{
    n--;
    if(n>0)document.getElementById('deadmsg').textContent='ВЫ ПОГИБЛИ — '+n+'...';
    else{clearInterval(pRespT);respawnPlayer();}
  },1000);
}

/* ВВОД */
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='Digit1')switchWeapon('ak');
  if(e.code==='Digit2')switchWeapon('awp');
  if(e.code==='Digit3')switchWeapon('knife');
  if(e.code==='Space'&&player.onGround&&player.alive){
    player.velY=5.2;player.onGround=false;
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});

let shooting=false;
canvas.addEventListener('click',()=>{
  initAudio();
  if(!isTouch&&gameState==='playing'&&!document.pointerLockElement){
    canvas.requestPointerLock();
  }
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas&&gameState==='playing'&&player.alive){
    const sens=.0022*(1-player.adsAmount*.55);
    player.yaw-=e.movementX*sens;
    player.pitch-=e.movementY*sens;
    player.pitch=clamp(player.pitch,-Math.PI/2+.05,Math.PI/2-.05);
  }
});
document.addEventListener('mousedown',e=>{
  if(gameState!=='playing')return;
  if(e.button===0&&!isTouch)shooting=true;
  if(e.button===2&&!isTouch)setAiming(true);
});
document.addEventListener('mouseup',e=>{
  if(e.button===0)shooting=false;
  if(e.button===2&&!isTouch)setAiming(false);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ТАЧ */
const joyEl=document.getElementById('joy');
const knobEl=joyEl.querySelector('.knob');
const joy={active:false,id:null,dx:0,dy:0,bx:0,by:0,R:70};
joyEl.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  if(joy.active)return;
  const t=e.changedTouches[0],r=joyEl.getBoundingClientRect();
  joy.active=true;joy.id=t.identifier;
  joy.bx=r.left+r.width/2;joy.by=r.top+r.height/2;joy.R=r.width/2;
  joy.dx=0;joy.dy=0;
},{passive:false});
joyEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      const dx=t.clientX-joy.bx,dy=t.clientY-joy.by;
      const d=Math.hypot(dx,dy),k=d>joy.R?joy.R/d:1;
      joy.dx=(dx*k)/joy.R;joy.dy=(dy*k)/joy.R;
      knobEl.style.left=(50+joy.dx*45)+'%';
      knobEl.style.top=(50+joy.dy*45)+'%';
    }
  }
},{passive:false});
function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      joy.active=false;joy.id=null;joy.dx=0;joy.dy=0;
      knobEl.style.left='50%';knobEl.style.top='50%';
    }
  }
}
joyEl.addEventListener('touchend',joyEnd);
joyEl.addEventListener('touchcancel',joyEnd);

const lookEl=document.getElementById('look-zone');
const look={active:false,id:null,lx:0,ly:0};
lookEl.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  if(look.active)return;
  const t=e.changedTouches[0];
  look.active=true;look.id=t.identifier;
  look.lx=t.clientX;look.ly=t.clientY;
},{passive:false});
lookEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===look.id&&player.alive){
      const dx=t.clientX-look.lx,dy=t.clientY-look.ly;
      look.lx=t.clientX;look.ly=t.clientY;
      const sens=.0055*(1-player.adsAmount*.55);
      player.yaw-=dx*sens;player.pitch-=dy*sens;
      player.pitch=clamp(player.pitch,-Math.PI/2+.05,Math.PI/2-.05);
    }
  }
},{passive:false});
function lookEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===look.id)look.active=false;
  }
}
lookEl.addEventListener('touchend',lookEnd);
lookEl.addEventListener('touchcancel',lookEnd);

const btnFire=document.getElementById('btn-fire');
btnFire.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();shooting=true;
  btnFire.classList.add('active');
},{passive:false});
btnFire.addEventListener('touchend',e=>{
  e.preventDefault();shooting=false;
  btnFire.classList.remove('active');
},{passive:false});
btnFire.addEventListener('touchcancel',()=>{
  shooting=false;btnFire.classList.remove('active');
});

document.getElementById('btn-ads').addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  setAiming(!player.aiming);
},{passive:false});
document.getElementById('btn-reload').addEventListener('touchstart',e=>{
  e.preventDefault();reload();
},{passive:false});
document.getElementById('btn-weapon').addEventListener('touchstart',e=>{
  e.preventDefault();
  const i=WEAPON_ORDER.indexOf(player.weapon);
  switchWeapon(WEAPON_ORDER[(i+1)%WEAPON_ORDER.length]);
},{passive:false});

/* HUD */
function updateHUD(){
  document.querySelector('#hp-panel .val').textContent=Math.max(0,Math.ceil(player.hp));
  const w=WEAPONS[player.weapon];
  const a=player.reloading?'...':(w.melee?'∞':player.ammo[player.weapon]);
  const m=w.melee?'∞':w.mag;
  document.querySelector('#ammo-panel .weapon').textContent=w.name;
  document.querySelector('#ammo-panel .ammo').innerHTML=a+'<small>/ '+m+'</small>';
}
function updateKillsHUD(){
  document.querySelector('#kills-panel .you b').textContent=player.kills;
  document.querySelector('#kills-panel .bot b').textContent=player.deaths;
}
let hitT=null;
function showHitmarker(isHead){
  const hm=document.getElementById('hitmarker');
  hm.classList.toggle('head',!!isHead);hm.classList.add('on');
  clearTimeout(hitT);
  hitT=setTimeout(()=>hm.classList.remove('on'),150);
}
let kfT=null;
function showKillfeed(text,color){
  const el=document.getElementById('killfeed');
  el.textContent=text;el.style.color=color||'#fff';
  el.classList.add('on');
  clearTimeout(kfT);
  kfT=setTimeout(()=>el.classList.remove('on'),1600);
}

/* ОБНОВЛЕНИЕ ИГРОКА */
const clock=new THREE.Clock();
let gameState='menu';
function updatePlayer(dt){
  if(!player.alive)return;

  if(player.reloading&&performance.now()>=player.reloadEnd){
    player.reloading=false;
    player.ammo[player.weapon]=WEAPONS[player.weapon].mag;
    updateHUD();
  }

  const targetAds=player.aiming?1:0;
  player.adsAmount=lerp(player.adsAmount,targetAds,Math.min(1,dt*16));
  if(Math.abs(player.adsAmount-targetAds)<.001)player.adsAmount=targetAds;

  let fw=0,st=0;
  if(keys['KeyW'])fw+=1;
  if(keys['KeyS'])fw-=1;
  if(keys['KeyD'])st+=1;
  if(keys['KeyA'])st-=1;
  if(joy.active){fw+=-joy.dy;st+=joy.dx;}
  const mag=Math.hypot(fw,st);
  if(mag>1){fw/=mag;st/=mag;}

  const speed=5.2*(1-player.adsAmount*.45);
  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  player.pos.x+=(fwd.x*fw+right.x*st)*speed*dt;
  player.pos.z+=(fwd.z*fw+right.z*st)*speed*dt;
  resolveCollisions(player.pos);

  player.velY-=18*dt;
  player.pos.y+=player.velY*dt;
  if(player.pos.y<=1.65){
    player.pos.y=1.65;player.velY=0;player.onGround=true;
  }

  const w=WEAPONS[player.weapon];
  if(shooting){
    if(w.auto)tryShoot();
    else if(!player._semiLatch){tryShoot();player._semiLatch=true;}
  }else player._semiLatch=false;

  player.bobT+=dt*(mag>.1?10:3);
  const bob=mag>.1&&player.adsAmount<.5?Math.sin(player.bobT)*.025:0;
  camera.position.set(player.pos.x,player.pos.y+bob,player.pos.z);
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch;
  if(player.recoil>0){
    camera.rotation.x+=player.recoil;
    player.recoil*=.72;
    if(player.recoil<.001)player.recoil=0;
  }

  const pose=GUN_POSES[player.weapon];
  const targetFov=78+(pose.fov-78)*player.adsAmount;
  camera.fov=lerp(camera.fov,targetFov,Math.min(1,dt*18));
  camera.updateProjectionMatrix();

  const scopeEl=document.getElementById('scope');
  const crossEl=document.getElementById('crosshair');

  if(player.weapon==='awp'){
    gunModels.awp.visible=player.adsAmount<.5;
    if(player.adsAmount>.05){
      scopeEl.classList.add('on');
      scopeEl.style.opacity=clamp((player.adsAmount-.5)*2,0,1);
    }else{
      scopeEl.classList.remove('on');
      scopeEl.style.opacity=0;
    }
    crossEl.style.opacity=clamp(1-player.adsAmount*2,0,1);
  }else{
    if(pose.ads){
      const hip=pose.hip,ads=pose.ads;
      const m=gunModels[player.weapon];
      m.position.set(
        lerp(hip.pos[0],ads.pos[0],player.adsAmount),
        lerp(hip.pos[1],ads.pos[1],player.adsAmount),
        lerp(hip.pos[2],ads.pos[2],player.adsAmount)
      );
      m.rotation.set(
        lerp(hip.rot[0],ads.rot[0],player.adsAmount),
        lerp(hip.rot[1],ads.rot[1],player.adsAmount),
        lerp(hip.rot[2],ads.rot[2],player.adsAmount)
      );
      m.position.x+=Math.cos(player.bobT*.5)*bob*.3;
      m.position.y+=Math.sin(player.bobT)*bob*.2;
      crossEl.classList.toggle('ads',player.adsAmount>.5);
      crossEl.style.opacity=1;
    }
    scopeEl.classList.remove('on');
    scopeEl.style.opacity=0;
  }
}

function cleanupTracers(){
  const now=performance.now();
  for(let i=tracers.length-1;i>=0;i--){
    if(now-tracers[i].t>120){
      scene.remove(tracers[i].line);
      tracers[i].line.geometry.dispose();
      tracers[i].line.material.dispose();
      tracers.splice(i,1);
    }
  }
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(gameState==='playing'){
    updatePlayer(dt);
    updateBot(dt);
    updateSparks(dt);
    updateDust(dt);
    skyMesh.position.copy(camera.position);
  }
  cleanupTracers();
  renderer.render(scene,camera);
}

document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.add('on');
  if(isTouch)document.getElementById('touch').classList.add('on');
  gameState='playing';
  respawnPlayer();respawnBot();
  updateHUD();updateKillsHUD();
  if(!isTouch)setTimeout(()=>canvas.requestPointerLock(),100);
});

updateHUD();updateKillsHUD();
requestAnimationFrame(loop);
</script>
</body>
